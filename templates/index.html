<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Audio Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6, #93c5fd);
        }
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md mx-auto">
        <div id="upload-container" class="card rounded-2xl p-8 shadow-2xl text-center">
            <h1 class="text-3xl font-bold mb-2">Deepfake Audio Detector</h1>
            <p class="text-indigo-200 mb-6">Upload an audio file to check if it's real or a deepfake.</p>
            
            <div class="border-2 border-dashed border-gray-400 rounded-xl p-8 cursor-pointer hover:border-white transition-colors" id="drop-zone">
                <input type="file" id="audio-file-input" class="hidden" accept="audio/*">
                <svg class="mx-auto h-12 w-12 text-white" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="mt-4 text-lg">Drag & drop your audio file here</p>
                <p class="text-sm text-gray-300 mt-1">or</p>
                <button id="browse-btn" class="mt-2 bg-white text-blue-600 font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-gray-100 transition-all">
                    Browse File
                </button>
            </div>
            <p id="file-name" class="mt-4 text-gray-300"></p>
        </div>

        <div id="loading-container" class="hidden text-center p-8">
            <div class="spinner mx-auto"></div>
            <p class="mt-4 text-lg font-semibold">Analyzing audio...</p>
        </div>

        <div id="result-container" class="hidden card rounded-2xl p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-bold mb-4">Analysis Complete</h2>
            <div id="result-card" class="rounded-xl p-6 mb-6">
                <p class="text-5xl font-bold" id="prediction"></p>
                <p class="text-indigo-200 mt-2" id="prediction-label">Prediction</p>
            </div>
            <div class="bg-white/20 rounded-xl p-6">
                <p class="text-5xl font-bold" id="accuracy"></p>
                <p class="text-indigo-200 mt-2">Confidence Score</p>
            </div>
            <button id="reset-btn" class="mt-8 w-full bg-white text-blue-600 font-semibold py-3 px-4 rounded-lg shadow-md hover:bg-gray-100 transition-all">
                Analyze Another File
            </button>
        </div>
    </div>

    <script>
        // --- DOM Element Selection ---
        const dropZone = document.getElementById('drop-zone');
        const audioFileInput = document.getElementById('audio-file-input');
        const browseBtn = document.getElementById('browse-btn');
        const fileNameDisplay = document.getElementById('file-name');
        
        const uploadContainer = document.getElementById('upload-container');
        const loadingContainer = document.getElementById('loading-container');
        const resultContainer = document.getElementById('result-container');
        
        const predictionEl = document.getElementById('prediction');
        const accuracyEl = document.getElementById('accuracy');
        const resultCard = document.getElementById('result-card');
        const resetBtn = document.getElementById('reset-btn');

        // --- Event Listeners ---
        browseBtn.addEventListener('click', () => audioFileInput.click());
        audioFileInput.addEventListener('change', handleFileSelect);
        resetBtn.addEventListener('click', resetUI);

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('border-white', 'bg-white/10');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('border-white', 'bg-white/10');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('border-white', 'bg-white/10');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                audioFileInput.files = files;
                handleFileSelect();
            }
        });
        
        dropZone.addEventListener('click', () => audioFileInput.click());

        /**
         * Handles the file selection event.
         */
        function handleFileSelect() {
            const file = audioFileInput.files[0];
            if (file && file.type.startsWith('audio/')) {
                fileNameDisplay.textContent = `Selected file: ${file.name}`;
                // Using a small timeout can help prevent UI glitches on some browsers
                setTimeout(startAnalysis, 100);
            } else if (file) {
                fileNameDisplay.textContent = 'Please select a valid audio file.';
            }
        }

        /**
         * Sends the selected audio file to the backend for analysis.
         */
        async function startAnalysis() {
            const file = audioFileInput.files[0];
            if (!file) return;

            uploadContainer.classList.add('hidden');
            loadingContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const result = await response.json();

                if (result.prediction === 'FAKE') {
                    predictionEl.textContent = 'FAKE';
                    resultCard.style.backgroundColor = 'rgba(239, 68, 68, 0.6)';
                } else {
                    predictionEl.textContent = 'REAL';
                    resultCard.style.backgroundColor = 'rgba(34, 197, 94, 0.6)';
                }
                accuracyEl.textContent = `${result.confidence}%`;

            } catch (error) {
                console.error('Error during analysis:', error);
                predictionEl.textContent = 'ERROR';
                accuracyEl.textContent = 'N/A';
                resultCard.style.backgroundColor = 'rgba(107, 114, 128, 0.6)';
                fileNameDisplay.textContent = "Could not connect to the backend server.";
            } finally {
                loadingContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
            }
        }

        /**
         * Resets the UI to the initial upload state.
         */
        function resetUI() {
            resultContainer.classList.add('hidden');
            uploadContainer.classList.remove('hidden');
            audioFileInput.value = '';
            fileNameDisplay.textContent = '';
        }
    </script>
</body>
</html>
